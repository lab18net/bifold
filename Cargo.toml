[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Andrey Abramov <stinger911@gmail.com>"]
repository = "https://github.com/lab18/bifold"
homepage = "https://lab18.io/bifold"

[workspace.dependencies]
bifold-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
